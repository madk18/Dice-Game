<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dice Challenge</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game">
      <p class="eyebrow">A little game of chance</p>
      <h1>Dice Challenge</h1>
      <p class="subtitle">Roll the dice to see who wins</p>
      <section class="players">
        <article class="player-card">
          <h2>player 1</h2>
          <img
            src="images/dice1.svg"
            alt="player dice1"
            id="dice1"
            class="die" />
          <p>first player</p>
        </article>
        <article class="player-card">
          <h2>player 2</h2>
          <img
            src="images/dice2.svg"
            alt="player dice2"
            id="dice2"
            class="die" />
          <p>second player</p>
        </article>
      </section>
      <button id="rollButton" class="roll-button">Roll Dice</button>
      <p id="result" class="result">Ready to play</p>
      <footer>HTML, CSS &amp; JavaScript . MH Tech Somalia</footer>
    </main>
    <script src="script.js"></script>
  </body>
</html>
